[project]
name = "qkd-cascade-ldpc"
version = "0.1.0"
description = "Information reconciliation algorithms for QKD: Cascade, blind LDPC, asymmetric adaptive LDPC"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "sequence>=0.8",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
phase2 = ["fastapi>=0.110", "uvicorn>=0.27", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
